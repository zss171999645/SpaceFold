[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "spacefold-panorama"
version = "0.1.0.dev0"
description = "Multiscale 3D autoencoding and panorama-conditioned scene generation"
readme = "README.md"
license-files = ["THIRD_PARTY.md"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
inference = [
    "torch>=2.4",
    "torchvision>=0.19",
    "Pillow>=10",
    "safetensors>=0.5,<1",
    "einops>=0.8,<1",
    "huggingface-hub>=0.24,<1",
    "spconv-cu120==2.3.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton>=3; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
spacefold-infer = "spacefold.panorama.infer:main"
spacefold-geometry = "spacefold.geometry.__main__:main"

[tool.setuptools.packages.find]
include = ["spacefold", "spacefold.*"]
namespaces = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
